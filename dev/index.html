<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* モバイル対応のフラグ（CSS が最初のペイントから正しい側を選べるよう <head> で同期的に付ける）
     ?desktop=1        → <html data-desktop>  … 幅に関係なく従来のPC版レイアウトに固定する逃げ道
     タッチ主体の端末  → <html data-touch>    … 音声ゲート既定化など JS 側の分岐に使う
   モバイル用の上書き CSS はすべて assets/mobile.css にあり、html:not([data-desktop]) 配下に置く。 */
(function () {
  try {
    var h = document.documentElement, q = location.search;
    if (/[?&]desktop=1/.test(q)) h.setAttribute('data-desktop', '');
    var touch = /[?&]touch=1/.test(q) ||
      ((navigator.maxTouchPoints || 0) > 0 && matchMedia('(hover: none)').matches);
    if (touch && !/[?&]touch=0/.test(q)) h.setAttribute('data-touch', '');
  } catch (_) {}
})();
</script>
<script>
/* boot.js — 打上前カウントダウン（初回ロードのローディング画面）

   index.html は盤面のHTMLを先に描き、末尾でCSS7本・JS13本(227KB)を同期で読む。
   タイトル画面(title.js)が出るのは全部読み終わったあと＝DOMContentLoaded なので、
   それまで「素の盤面」が固まったまま見える。実測(初回・キャッシュ無し):
       localhost      DCL   63ms      1.6Mbps/150ms  DCL 1635ms
       0.4Mbps/400ms  DCL 6154ms  ←  6秒間ずっと素の盤面
   その空白を宇宙開発のカウントダウンで埋めて、タイトルへ地続きに渡す。

   ■ 置き場所（順番が結果を決める）
     index.html の <head>、viewport の meta の直後（40KBあるインライン style より前）に
     **このファイルの中身をそのまま script タグの中へ貼る**。
     0.4Mbps/400ms・キャッシュ無しでの初回描画の実測:
         ローディング画面なし                        0.69s（＝素の盤面が見えてしまう）
         head 先頭で <script src="assets/boot.js">   2.2〜2.6s（1往復ぶん遅れる）
         head 先頭に中身を直接貼る                    1.05s（推奨）
     外部ファイルにすると「ローディング画面自身の読み込み待ち」が発生して本末転倒。
     （gzip の効く配信なら 17.8KB → 7.3KB なので外部でも差は縮む）
     assets/boot.js は原本として残し、貼り付け元はここ一箇所にする。

   ■ 進捗は実測のみ。固定アニメーションでごまかさない
     A  0→18%  HTML本体の到着量  documentElement.outerHTML の長さ / 44KB
     B 18→92%  CSS/JSの読み込み  MutationObserver で発見 → load/error と
                                 PerformanceObserver('resource') で完了判定。
                                 重み＝実測の転送バイト数（engine.js 51KB が最大）
     C   →100%  DOMContentLoaded ＝ title.js が実行され #sdg-title が生まれた瞬間

   ■ 自分は何も待たない
     CSS もこの中の文字列から <style> で注入する。boot.css は「遅れて届いても
     増えるだけ」の装飾だけを持つ（body より後ろで読まれるため）。
   ■ index.html / title.js には触らない。タイトルの出現は DOM 監視で拾う。 */
(function () {
  'use strict';
  if (window.__sdgBoot) return;
  var doc = document;
  try { if (/[?&]noboot=1/.test(location.search)) return; } catch (_) {}   // 演出デバッグ用

  var t0 = performance.now ? performance.now() : Date.now();
  var since = function () { return (performance.now ? performance.now() : Date.now()) - t0; };
  var reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}
  var finished = false;

  /* ---------------------------------------------------------------- 見た目
     配色は index.html / board.css の :root と同じ値。まだ :root が読まれていない
     時点で描くので var(--x, 実値) で二重に持つ。背景のグラデーションは
     title.css の #sdg-title と完全に同一 ＝ 重ねてフェードしても背景が動かない。 */
  var CSS =
  '#sdg-boot{position:fixed;inset:0;z-index:2000;overflow:hidden;display:flex;' +
    'align-items:center;justify-content:center;color:var(--tx,#e8ecf8);' +
    'font-family:"Hiragino Sans","Noto Sans JP",sans-serif;opacity:1;transition:opacity .42s ease;' +
    'background:radial-gradient(120% 90% at 50% 118%,#16305c 0%,#0b1226 42%,#05070f 100%)}' +
  '#sdg-boot.out{opacity:0;pointer-events:none}' +
  /* 星空。title.js の Canvas と同じく上へ流れる */
  '#sdg-boot .stars{position:absolute;left:0;right:0;top:-360px;bottom:-360px;pointer-events:none}' +
  '#sdg-boot .s1{opacity:.62;background-size:240px 240px;animation:sdgbDrift 46s linear infinite;background-image:' +
    'radial-gradient(1.3px 1.3px at 24px 38px,#dce9ff,transparent),' +
    'radial-gradient(1px 1px at 128px 96px,#cfe0ff,transparent),' +
    'radial-gradient(1.6px 1.6px at 196px 22px,#fff,transparent),' +
    'radial-gradient(1px 1px at 72px 178px,#bcd2f5,transparent),' +
    'radial-gradient(1.2px 1.2px at 168px 214px,#e8f1ff,transparent)}' +
  '#sdg-boot .s2{opacity:.38;background-size:360px 360px;animation:sdgbDrift 84s linear infinite;background-image:' +
    'radial-gradient(1px 1px at 60px 20px,#aec6ee,transparent),' +
    'radial-gradient(.9px .9px at 300px 140px,#c8dbff,transparent),' +
    'radial-gradient(1.1px 1.1px at 210px 300px,#dce9ff,transparent),' +
    'radial-gradient(.9px .9px at 20px 250px,#9fb8e6,transparent)}' +
  '@keyframes sdgbDrift{to{transform:translateY(-360px)}}' +
  /* 遠くの地球。title.css の .earth(top:76vh) より低く暗く置き、
     タイトルの earthRise が「せり上がってくる」余地を残す */
  '#sdg-boot .horizon{position:absolute;left:50%;top:86vh;width:260vw;height:260vw;opacity:.5;' +
    'transform:translateX(-50%);border-radius:50%;pointer-events:none;' +
    'background:radial-gradient(circle at 50% 2%,#2f6aab 0%,#1a4478 6%,#0d2547 14%,#071427 30%,#050b16 60%);' +
    'box-shadow:0 0 70px 12px rgba(90,170,255,.20),inset 0 6px 30px rgba(160,215,255,.14)}' +
  '#sdg-boot .core{position:relative;z-index:3;width:min(560px,84vw);text-align:center}' +
  '#sdg-boot .kick{font-size:11px;letter-spacing:.34em;text-indent:.34em;margin-bottom:20px;color:var(--dim,#96a0c0)}' +
  '#sdg-boot .ph{min-height:32px;font-size:clamp(19px,3.4vw,25px);font-weight:800;color:#eaf1ff;' +
    'letter-spacing:.14em;text-shadow:0 0 22px rgba(120,190,255,.45)}' +
  '#sdg-boot .sub{min-height:18px;margin:4px 0 24px;font-size:12px;letter-spacing:.16em;color:var(--dim,#96a0c0)}' +
  /* 数字は等幅にして桁が変わっても踊らせない */
  '#sdg-boot .pct{font-size:clamp(40px,8vw,62px);font-weight:800;line-height:1;color:#fff;' +
    'font-variant-numeric:tabular-nums;font-feature-settings:"tnum";' +
    'text-shadow:0 0 30px rgba(120,190,255,.5),0 4px 20px rgba(0,0,0,.7)}' +
  '#sdg-boot .pct i{font-style:normal;font-size:.38em;margin-left:.18em;letter-spacing:.1em;color:var(--acc,#f2c14e)}' +
  /* 軌道＝プログレスバー */
  '#sdg-boot .track{position:relative;height:4px;margin-top:22px;border-radius:3px;' +
    'background:rgba(160,190,255,.10);box-shadow:inset 0 0 0 1px var(--line,#2a3355)}' +
  '#sdg-boot .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;' +
    'background:linear-gradient(90deg,#e89a2b,#f2c14e 60%,#fff3cd);' +
    'box-shadow:0 0 14px rgba(242,193,78,.75);transition:width .3s cubic-bezier(.3,.8,.35,1)}' +
  '#sdg-boot .ship{position:absolute;top:50%;left:0;font-size:18px;line-height:1;' +
    'transform:translate(-50%,-58%);filter:drop-shadow(0 0 9px #ffb84d);' +
    'transition:left .3s cubic-bezier(.3,.8,.35,1)}' +
  /* 段階マーカー MECO=第1段燃焼終了 / SEP=フェアリング分離 / SECO=第2段燃焼終了 */
  '#sdg-boot .marks{position:relative;height:16px;margin-top:9px;font-size:9px;letter-spacing:.18em;color:#6f80a6}' +
  '#sdg-boot .marks span{position:absolute;transform:translateX(-50%);white-space:nowrap}' +
  '#sdg-boot .marks span::before{content:"";position:absolute;left:50%;top:-11px;width:1px;height:6px;' +
    'background:var(--line,#2a3355)}' +
  '#sdg-boot .marks span.on{color:var(--acc,#f2c14e)}' +
  '#sdg-boot .marks span.on::before{background:var(--acc,#f2c14e)}' +
  /* 実際に受け取ったファイル名を出す（進捗が本物であることが目に見える） */
  '#sdg-boot .now{height:15px;margin-top:16px;font-size:10.5px;color:#7f8fb5;opacity:.85;' +
    'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;' +
    'white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
  '#sdg-boot .skip{height:16px;margin-top:20px;font-size:11px;letter-spacing:.1em;color:#6f80a6;' +
    'opacity:0;pointer-events:none;transition:opacity .5s ease}' +
  '#sdg-boot .skip.on{opacity:1;cursor:pointer;pointer-events:auto}' +
  '#sdg-boot .skip.on:hover{color:var(--acc,#f2c14e)}' +
  /* 動きを減らす設定では漂う星も滑らかな伸びも止め、数字とバーだけ更新する */
  '@media (prefers-reduced-motion:reduce){#sdg-boot .s1,#sdg-boot .s2{animation:none}' +
    '#sdg-boot .fill,#sdg-boot .ship{transition:none}#sdg-boot{transition:opacity .01s linear}}';

  var st = doc.createElement('style');
  st.id = 'sdg-boot-style';
  st.textContent = CSS;
  (doc.head || doc.documentElement).appendChild(st);

  /* ------------------------------------------------------------------ DOM
     head で走るので <body>
<div id="devbadge">DEV — 検証用</div> はまだ無い。position:fixed なので documentElement の
     直下に置いてもレイアウトには影響しない。.neb は boot.css が後から色を乗せる箱。 */
  var root = doc.createElement('div');
  root.id = 'sdg-boot';
  root.setAttribute('role', 'progressbar');
  root.setAttribute('aria-label', '読み込み中');
  root.setAttribute('aria-valuemin', '0');
  root.setAttribute('aria-valuemax', '100');
  root.setAttribute('aria-valuenow', '0');
  root.innerHTML =
    '<div class="neb"></div><div class="stars s1"></div><div class="stars s2"></div>' +
    '<div class="horizon"></div>' +
    '<div class="core">' +
      '<div class="kick">SPACE DEVELOPMENT RACE</div>' +
      '<div class="ph">T-10 カウントダウン</div>' +
      '<div class="sub">全システム点検</div>' +
      '<div class="pct">0<i>%</i></div>' +
      '<div class="track"><div class="fill"></div><div class="ship">🚀</div></div>' +
      '<div class="marks"><span data-at="36" style="left:36%">MECO</span>' +
        '<span data-at="58" style="left:58%">SEP</span>' +
        '<span data-at="92" style="left:92%">SECO</span></div>' +
      '<div class="now"></div>' +
      '<div class="skip">クリックで表示をとばす</div>' +
    '</div>';
  (doc.body || doc.documentElement).appendChild(root);

  var elPh = root.querySelector('.ph'), elSub = root.querySelector('.sub');
  var elPct = root.querySelector('.pct'), elFill = root.querySelector('.fill');
  var elShip = root.querySelector('.ship'), elNow = root.querySelector('.now');
  var elSkip = root.querySelector('.skip'), marks = root.querySelectorAll('.marks span');
  window.__sdgBoot = {el: root, t0: t0};

  /* ------------------------------------------------- A. HTML本体の到着量
     index.html は 44KB。うち約40KBが head のインライン <style> で、遅い回線では
     ここが最初の壁になる。パーサが流し込んだぶんだけ outerHTML が伸びる。 */
  var HTML_BYTES = 44000;
  function parseRatio() {
    if (doc.readyState !== 'loading') return 1;
    try { return Math.min(1, doc.documentElement.outerHTML.length / HTML_BYTES); }
    catch (_) { return 0; }
  }

  /* ------------------------------------------------- B. CSS/JS の読み込み
     重み＝実測の転送バイト数(KB)。表に無いものは 5KB とみなす（外れても
     「終わった本数の割合」から大きくはずれない）。 */
  var WEIGHT = {
    'engine.js': 50, 'board.css': 27, 'ending.js': 22, 'cards.js': 22, 'title.css': 19,
    'opening.js': 16, 'ending.css': 14, 'narrator.js': 11, 'sfx.js': 9, 'rules.js': 9,
    'title.js': 6, 'narrate.js': 5, 'mission_fx.js': 5, 'card_fx.js': 4, 'narrator.css': 3,
    'boot.css': 1, 'cpu_digest.css': 1, 'launch_fx.css': 1, 'cpu_digest.js': 1, 'launch_fx.js': 1
  };
  var PRIOR_COUNT = 20;      // 実測: CSS 7本 + JS 13本
  var PRIOR_WEIGHT = 227;    // 実測: 合計 227KB
  var items = {}, list = [], parsedAll = false;

  function abs(u) { try { return new URL(u, doc.baseURI).href; } catch (_) { return String(u); } }
  function track(url) {
    var k = abs(url);
    if (!items[k]) { items[k] = {w: WEIGHT[k.split('?')[0].split('/').pop()] || 5, done: false, url: k};
                     list.push(items[k]); }
    return items[k];
  }
  function finish(it) {
    if (!it || it.done) return;
    it.done = true;
    elNow.textContent = '受信 ' + it.url.replace(/^.*\/(assets\/)?/, '');
    paint();
  }
  function register(el) {
    var url = el.tagName === 'LINK' ? el.getAttribute('href') : el.getAttribute('src');
    if (!url) return;
    var it = track(url);
    var fin = function () { finish(it); };
    el.addEventListener('load', fin);
    el.addEventListener('error', fin);         // 失敗もここで止めない（完了扱い）
    try {                                      // キャッシュ済みで load を取り逃した場合
      var e = performance.getEntriesByName(it.url);
      if (e.length && e[e.length - 1].responseEnd > 0) finish(it);
    } catch (_) {}
  }
  function scan(n) {
    if (!n || n.nodeType !== 1) return;
    if (n.tagName === 'SCRIPT' && n.src) register(n);
    else if (n.tagName === 'LINK' && /stylesheet/i.test(n.rel || '') && n.href) register(n);
    if (n.querySelectorAll) {
      var q = n.querySelectorAll('script[src],link[rel~="stylesheet"]');
      for (var i = 0; i < q.length; i++) scan(q[i]);
    }
  }

  var mo = null;
  try {
    mo = new MutationObserver(function (recs) {
      for (var i = 0; i < recs.length; i++) {
        var a = recs[i].addedNodes;
        for (var j = 0; j < a.length; j++) {
          scan(a[j]);
          // タイトル画面が生まれたら引き渡し（?gate=1 のときは #sdg-gate が先に出る）
          if (a[j].nodeType === 1 && (a[j].id === 'sdg-title' || a[j].id === 'sdg-gate')) done();
        }
      }
    });
    mo.observe(doc.documentElement, {childList: true, subtree: true});
  } catch (_) {}

  // load イベントを取り逃したぶんの保険。buffered:true で boot 実行前のぶんも拾う。
  try {
    new PerformanceObserver(function (l) {
      var es = l.getEntries();
      for (var i = 0; i < es.length; i++) {
        var e = es[i];
        if (items[e.name]) finish(items[e.name]);
        else if (e.initiatorType === 'script' || e.initiatorType === 'link') finish(track(e.name));
      }
    }).observe({type: 'resource', buffered: true});
  } catch (_) {}

  function resourceRatio() {
    var tot = 0, don = 0;
    for (var i = 0; i < list.length; i++) { tot += list[i].w; if (list[i].done) don += list[i].w; }
    /* まだ全部の script/link を見つけていない間は実測の総量を分母の下限にする。
       これが無いと「見つけた2本が終わった＝100%」と嘘をつき、あとで巻き戻る。 */
    if (!parsedAll && list.length < PRIOR_COUNT) tot = Math.max(tot, PRIOR_WEIGHT);
    return tot > 0 ? Math.min(1, don / tot) : 0;
  }

  /* ------------------------------------------------------------------ 表示 */
  var PHASES = [
    [0,   'T-10 カウントダウン', '全システム点検'],
    [14,  '点火',              'メインエンジン始動'],
    [36,  'リフトオフ',         '第1段燃焼'],
    [58,  'フェアリング分離',    '大気圏を抜ける'],
    [76,  '第2段燃焼',          'ミッションデータ受信'],
    [92,  '軌道投入',           '姿勢を安定させています'],
    [100, '軌道投入 完了',      'ミッション開始']
  ];
  var shown = 0, phaseIx = -1;      // shown は単調増加（巻き戻さない）

  function paint() {
    var p = 18 * parseRatio() + 74 * resourceRatio();
    if (doc.readyState !== 'loading') p = Math.max(p, 92);
    if (finished) p = 100;
    if (p > shown) shown = p;
    var v = Math.min(100, Math.round(shown));

    elPct.firstChild.nodeValue = String(v);
    elFill.style.width = v + '%';
    elShip.style.left = v + '%';
    root.setAttribute('aria-valuenow', String(v));

    var ix = 0;
    for (var i = 0; i < PHASES.length; i++) if (v >= PHASES[i][0]) ix = i;
    if (ix !== phaseIx) { phaseIx = ix; elPh.textContent = PHASES[ix][1]; elSub.textContent = PHASES[ix][2]; }
    for (var m = 0; m < marks.length; m++) {
      if (v >= +marks[m].getAttribute('data-at')) marks[m].classList.add('on');
    }
  }
  var timer = setInterval(paint, reduce ? 200 : 90);
  paint();

  /* -------------------------------------------------------------- 引き渡し
     DOMContentLoaded ＝ 末尾の title.js まで実行が終わった瞬間で、このとき
     #sdg-title は既に DOM にある（?fx / ?rules のデモ時だけ存在しない）。 */
  function done() {
    if (finished) return;
    finished = true;
    paint();
    clearInterval(timer);
    if (mo) try { mo.disconnect(); } catch (_) {}
    /* 速い環境（キャッシュ済み・localhost）では見えるか見えないかの一瞬。
       そこにフェードを挟むと逆に「ちらつく板」になるので即座に消す。
       最低表示時間は設けない。 */
    if (since() < 260 || reduce) return remove();
    /* title.css の earthRise / chDrop は #sdg-title が入った瞬間から動いている。
       背景グラデーションが同一なので、重ねてフェードすると背景は静止したまま
       地球とタイトル文字だけが下から現れる。 */
    requestAnimationFrame(function () {
      root.classList.add('out');
      setTimeout(remove, 460);
    });
  }
  function remove() {
    if (root.parentNode) root.parentNode.removeChild(root);
    if (st.parentNode) st.parentNode.removeChild(st);
    window.__sdgBoot.gone = true;
  }

  doc.addEventListener('DOMContentLoaded', function () {
    parsedAll = true; paint();
    requestAnimationFrame(done);
  });
  doc.addEventListener('readystatechange', function () {
    if (doc.readyState !== 'loading') { parsedAll = true; paint(); }
    if (doc.readyState === 'complete') done();
  });
  window.addEventListener('load', done);
  setTimeout(done, 20000);                                        // 何が詰まっても明け渡す
  setTimeout(function () { if (!finished) elSkip.classList.add('on'); }, 6000);
  root.addEventListener('click', function () { if (elSkip.classList.contains('on')) done(); });
})();

</script>
<!-- BOOT_INLINE — assets/boot.js の中身をここへ差し込む（serve.py と publish_site.py が行う）。
     外部 <script src> にすると「ローディング画面自身の読み込み待ち」で初回描画が1往復ぶん
     遅れる（0.4Mbps 実測で 1.05s → 2.2s）。原本は assets/boot.js の1つだけ。 -->
<meta name="robots" content="noindex,nofollow">

<!-- Slack / X / Facebook にリンクを貼ったときのサムネイル（OGP）。
     og:image は絶対URLでないと展開されないので、公開先のURLを直接書く。
     画像は tools/build_og_image.py で生成する（1200x630）。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="宇宙開発レース">

<meta property="og:image" content="https://akiralab.github.io/space-develop-game-play/dev/og.jpg">

<style>
  :root { --bg:#0d1220; --panel:#161d31; --panel2:#1d2540; --line:#2a3355;
          --tx:#e8ecf8; --dim:#96a0c0; --acc:#f2c14e; --ok:#4caf82; --ng:#e05d5d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--tx); font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
         font-size:14px; padding:14px 16px 60px; }
  h1 { font-size:18px; letter-spacing:.08em; }
  h2 { font-size:13px; color:var(--dim); margin:0 0 6px; letter-spacing:.1em; }
  .top { display:flex; align-items:baseline; gap:18px; margin-bottom:10px; flex-wrap:wrap; }
  .top .stat { color:var(--dim); } .top b { color:var(--acc); font-size:16px; }
  .cols { display:grid; grid-template-columns: 1fr 330px; gap:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:14px; }
  /* カード（券面iframe） */
  .cardbox { position:relative; width:143px; height:194px; border-radius:8px; overflow:hidden;
             flex:0 0 auto; cursor:zoom-in; box-shadow:0 4px 14px rgba(0,0,0,.45); }
  .cardbox iframe { width:816px; height:1110px; border:0; transform:scale(.175); transform-origin:top left;
                    pointer-events:none; }
  .cardrow { display:flex; gap:10px; flex-wrap:wrap; }
  .cardwrap { display:flex; flex-direction:column; gap:6px; align-items:center; }
  .cardwrap .sub { font-size:11px; color:var(--dim); text-align:center; max-width:143px; }
  .badge { position:absolute; top:4px; right:4px; background:var(--acc); color:#222; font-weight:800;
           font-size:11px; border-radius:8px; padding:1px 7px; }
  .pick { outline:3px solid var(--acc); }
  /* ボタン */
  button { background:var(--panel2); color:var(--tx); border:1px solid var(--line); border-radius:8px;
           padding:7px 12px; font-size:13px; cursor:pointer; text-align:left; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#1c1608; font-weight:800; }
  button:disabled { opacity:.4; cursor:default; }
  .btncol { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .free { border-left:4px solid var(--ok); }
  .cost1 { border-left:4px solid var(--acc); }
  /* 対戦相手 */
  .opp { display:flex; gap:14px; flex-wrap:wrap; }
  .oppbox { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 12px; flex:1; min-width:200px; }
  .oppbox .nm { font-weight:800; } .oppbox .pol { font-size:11px; color:var(--acc); }
  .oppbox .row { font-size:12px; color:var(--dim); margin-top:3px; }
  /* ログ */
  #log { height:330px; overflow-y:auto; font-size:12px; line-height:1.7; white-space:pre-wrap;
         color:#c6cde4; }
  #log b { color:var(--acc); }
  .err { color:var(--ng); font-weight:700; margin:6px 0; }
  #dice { font-size:15px; color:var(--acc); min-height:22px; margin:4px 0; }
  /* モーダル */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none;
           align-items:center; justify-content:center; z-index:50; cursor:zoom-out; }
  #modal .mwrap { display:flex; gap:20px; align-items:stretch; cursor:default; }
  #modal .big { width:490px; height:666px; border-radius:14px; overflow:hidden; flex:0 0 auto; }
  #minfo { width:430px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
           padding:20px; overflow-y:auto; max-height:666px; }
  /* 実機の諸元・来歴（card_fx.js が assets/carddoc.json から差し込む） */
  #minfo .dochead { margin:14px 0 6px; font-size:11px; letter-spacing:.18em; color:var(--acc);
                    border-top:1px solid var(--line); padding-top:12px; }
  #minfo table.docspec { width:100%; border-collapse:collapse; font-size:12.5px; }
  #minfo table.docspec th { width:33%; text-align:left; vertical-align:top; font-weight:600;
                            color:var(--dim); padding:4px 8px 4px 0; white-space:nowrap; }
  #minfo table.docspec td { vertical-align:top; padding:4px 0; color:var(--tx); }
  #minfo .docnews { margin-top:10px; font-size:12.5px; line-height:1.75; color:var(--tx);
                    background:var(--panel2); border-left:3px solid var(--acc);
                    border-radius:0 6px 6px 0; padding:9px 12px; }
  #minfo h3 { color:var(--acc); font-size:18px; margin-bottom:10px; }
  #minfo .spec { font-size:12px; color:var(--dim); margin-bottom:12px; }
  #minfo .lore { font-size:14px; line-height:1.9; white-space:pre-wrap; }
  #minfo .credit { margin-top:14px; font-size:11px; color:var(--dim); }
  #modal iframe { width:816px; height:1110px; border:0; transform:scale(.6); transform-origin:top left; pointer-events:none; }
  .missionrow .since { font-size:11px; color:var(--dim); }
  #overlay { position:sticky; bottom:0; }
  #sheetToggle { display:none; }              /* スマホ縦持ち専用（mobile.css で表示） */
  #mtabs { display:none; }                    /* 同上 */
  #handhint { display:none; }                 /* 同上 */
  #modalclose { display:none; }               /* 同上 */
  /* 新規ゲームの確認ポップアップ（ヘッダの🆕ボタン直下） */
  #ngpop { position:fixed; z-index:320; right:118px; top:52px; width:min(340px, calc(100vw - 24px));
           background:linear-gradient(180deg,#1a2340,#121829); border:1px solid var(--line);
           border-radius:12px; padding:12px 14px; box-shadow:0 18px 60px rgba(0,0,0,.7); }
  #ngpop[hidden] { display:none; }
  #ngpop .q { font-size:13px; line-height:1.6; color:var(--tx); }
  #ngpop .bt { display:flex; gap:8px; margin-top:10px; justify-content:flex-end; }
  #ngpop .bt button { text-align:center; padding:8px 14px; }
  #ngpop .bt .danger { background:var(--ng); color:#fff; font-weight:800; border-color:transparent; }
  table.rank { width:100%; border-collapse:collapse; font-size:14px; }
  table.rank td, table.rank th { padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; }
  /* ==== 演出（FX） ==== */
  #fxroot { position:fixed; inset:0; pointer-events:none; z-index:100; overflow:hidden; }
  .float-chip { position:fixed; font-weight:800; font-size:18px; pointer-events:none;
                animation: floatUp 1.3s ease-out forwards; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  @keyframes floatUp { 0%{opacity:0; transform:translateY(8px) scale(.8);}
    15%{opacity:1; transform:translateY(0) scale(1.15);} 30%{transform:scale(1);}
    100%{opacity:0; transform:translateY(-46px);} }
  .ghost-card { position:fixed; width:72px; height:98px; border-radius:6px; pointer-events:none;
                background:linear-gradient(160deg,#25305c,#141b38); border:2px solid #7fa3ff;
                box-shadow:0 8px 22px rgba(0,0,0,.6); display:flex; align-items:center;
                justify-content:center; font-size:26px; z-index:110;
                transition: all .55s cubic-bezier(.5,.05,.35,1); }
  .flash { animation: panelFlash .8s ease-out; }
  @keyframes panelFlash { 0%{box-shadow:0 0 0 3px var(--acc), 0 0 30px rgba(242,193,78,.6);}
    100%{box-shadow:0 0 0 0 transparent;} }
  .spark { position:fixed; pointer-events:none; font-size:20px; z-index:120;
           animation: sparkFly 1s ease-out forwards; }
  @keyframes sparkFly { 0%{opacity:1; transform:translate(0,0) scale(1);}
    100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.5);} }
  .bigpop { position:fixed; left:50%; top:42%; transform:translate(-50%,-50%);
            font-size:54px; font-weight:800; color:var(--acc); pointer-events:none; z-index:130;
            text-shadow:0 4px 24px rgba(0,0,0,.8); animation: bigPop 1.4s ease-out forwards; }
  @keyframes bigPop { 0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}
    20%{opacity:1; transform:translate(-50%,-50%) scale(1.2);}
    35%{transform:translate(-50%,-50%) scale(1);} 80%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-70%) scale(1);} }
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
           background:var(--panel2); border:1px solid var(--line); color:var(--dim);
           border-radius:20px; padding:8px 18px; font-size:13px; z-index:90;
           animation: toastIn 1.6s ease forwards; pointer-events:none; }
  @keyframes toastIn { 0%{opacity:0; transform:translate(-50%,10px);}
    12%{opacity:1; transform:translate(-50%,0);} 80%{opacity:1;} 100%{opacity:0;} }
  /* 打上シネマ */
  #cine { position:fixed; inset:0; z-index:200; display:none; align-items:center;
          justify-content:center; cursor:pointer; overflow:hidden;
          background:linear-gradient(180deg,#050914 0%,#0a1836 55%,#1c2f60 100%); }
  #cine .cstars { position:absolute; inset:0; opacity:.8; }
  #cine .rocket { position:absolute; bottom:6vh; left:50%; transform:translateX(-50%);
                  font-size:90px; transition: transform 1.1s cubic-bezier(.45,0,.9,.4);
                  filter: drop-shadow(0 0 18px rgba(255,182,72,.35)); }
  #cine .rocket.rumble { animation: rumble .5s linear infinite; }
  @keyframes rumble { 0%,100%{transform:translateX(-50%);} 25%{transform:translateX(calc(-50% - 3px));}
    75%{transform:translateX(calc(-50% + 3px));} }
  #cine .rocket.go { transform:translate(-50%,-130vh) !important; }
  #cine .rocket.dead { transform:translate(-50%,10vh) rotate(50deg) !important; opacity:.55;
                       transition: transform .9s ease-in, opacity .9s; }
  #cine .flame { position:absolute; left:50%; bottom:-34px; transform:translateX(-50%);
                 font-size:40px; opacity:0; }
  #cine .flame.on { opacity:1; animation: flick .12s linear infinite alternate; }
  @keyframes flick { from{transform:translateX(-50%) scaleY(1);} to{transform:translateX(-50%) scaleY(1.35);} }
  #cine .dicebox { position:absolute; top:16vh; left:50%; transform:translateX(-50%);
                   display:flex; gap:22px; }
  .die { width:74px; height:74px; border-radius:14px; background:#fffdf4; color:#1b1b1b;
         font-size:44px; font-weight:800; display:flex; align-items:center; justify-content:center;
         box-shadow:0 10px 26px rgba(0,0,0,.55); }
  .die.spin { animation: dieTumble .45s linear infinite; }
  @keyframes dieTumble { 0%{transform:rotate(0) translateY(0);} 25%{transform:rotate(90deg) translateY(-8px);}
    50%{transform:rotate(180deg);} 75%{transform:rotate(270deg) translateY(-8px);} 100%{transform:rotate(360deg);} }
  #cine .ctext { position:absolute; top:34vh; left:50%; transform:translateX(-50%);
                 font-size:34px; font-weight:800; color:#fff; text-shadow:0 3px 18px rgba(0,0,0,.8);
                 white-space:nowrap; }
  #cine .boom { position:absolute; bottom:12vh; left:50%; transform:translate(-50%,0);
                font-size:110px; animation: boomPop .7s ease-out forwards; }
  @keyframes boomPop { 0%{opacity:0; transform:translate(-50%,0) scale(.3);}
    30%{opacity:1; transform:translate(-50%,0) scale(1.25);} 100%{opacity:.9; transform:translate(-50%,0) scale(1);} }
  @keyframes csRise { from{transform:translateY(0);} to{transform:translateY(60vh);} }
</style>

  #devbadge { position:fixed; left:0; top:0; z-index:9999; pointer-events:none;

<header class="top">
  <div class="brand">

<!-- スマホ縦持ち専用のタブ（PC では非表示・mobile.css で表示）。body[data-mtab] でパネルを出し分ける -->

<div class="cols">
<div class="colL"><!-- 左カラム -->
  <section class="panel board">
    <h2><span class="kick">MISSION BOARD</span><span class="jp">場のミッション（常に3枚・解決で即補充）</span><span class="note" id="mleft"></span></h2>

    <h2><span class="kick">YOUR TURN</span><span class="jp">あなたの手番</span><span class="note" id="actleft"></span>

<div id="ngpop" hidden>

<!-- ブラウザ内ゲームエンジン（GitHub Pages 用）。cards.js が先である必要がある。
     ローカルの sim/serve.py で遊ぶときは実サーバを使うので、シムを無効化する。 -->
<!-- sim/serve.py で配信するときだけ、サーバ側がこの上に NoShim フラグを注入する。
     静的配信（GitHub Pages）では注入されないので、engine.js がゲームを担う。 -->
<!-- 公開版の既定設定。素の初期100億では進化・クリティカルの見せ場がほぼ出ないことが
     1000シードの実測で分かっているため、推奨パッケージ（初期300億・クリティカル+2点）を既定にする。
     URL で ?players=2&package=0&seed=42 のように上書きできる。 -->
<script>window.SDGEngineBoot = {players: 4, package: true};</script>
<script src="assets/cards.js"></script>
<script src="assets/engine.js"></script>
<link rel="stylesheet" href="assets/title.css">
<link rel="stylesheet" href="assets/ending.css">
<link rel="stylesheet" href="assets/narrator.css">
<link rel="stylesheet" href="assets/board.css">
<link rel="stylesheet" href="assets/boot.css">
<link rel="stylesheet" href="assets/cpu_digest.css">
<link rel="stylesheet" href="assets/avatars.css">
<link rel="stylesheet" href="assets/launch_fx.css">
<link rel="stylesheet" href="assets/mobile.css">
<script>
/* ==== 拡張フック（演出モジュールはここ経由でのみ本体に触る） ====
   各モジュールは window.SDG.* に登録する。本体側のコードは書き換えない。 */
window.SDG = {
  gate: {board: null, hand: null},   // 開幕演出中の表示枚数制限（null=制限なし）
  narrate: null,          // narrate.js が入れる: (id) => Promise
  onDraw: [],             // (state) => void  … render() のたびに呼ばれる
  onCardClick: [],        // (kind, slug, meta) => void … カード拡大時
  onMissionOpen: [],      // (slug) => void  … 課題公開時
  scene: {},              // 各演出モジュールが自分の制御APIを登録する場所
};
function sdgHook(list, ...args) {
  for (const f of (window.SDG[list] || [])) { try { f(...args); } catch (e) { console.warn(e); } }
}
let S = null;
let exchangeMode = false;
let picked = new Set();

const $ = id => document.getElementById(id);

function cardBox(kind, slug, subtitle, badge) {
  const w = document.createElement('div'); w.className = 'cardwrap';
  const b = document.createElement('div'); b.className = 'cardbox';
  const f = document.createElement('iframe');
  f.src = `cards/${kind}/${slug}.html`; f.loading = 'lazy';
  b.appendChild(f);
  if (badge) { const g = document.createElement('div'); g.className='badge'; g.textContent = badge; b.appendChild(g); }
  b.onclick = () => {
    if (b.dataset.hand !== undefined) {              // 手札
      if (exchangeMode) { togglePick(b); return; }   // 交換モードは従来どおり選択が優先
      openCardMenu(b, Number(b.dataset.hand), kind, slug);
      return;
    }
    openModal(kind, slug);
  };
  w.appendChild(b);
  if (subtitle) { const s = document.createElement('div'); s.className='sub'; s.textContent = subtitle; w.appendChild(s); }
  return {wrap: w, box: b};
}
function closeModal() {
  if ($('modal').style.display === 'none') return;
  $('modal').style.display = 'none';
  // モバイルで開いたときは履歴を1つ積んでいる（戻る操作で閉じるため）。ここで巻き戻す
  if (history.state && history.state.sdgModal) history.back();
}
$('modal').onclick = closeModal;
$('modalclose').onclick = e => { e.stopPropagation(); closeModal(); };
addEventListener('popstate', () => { if ($('modal').style.display !== 'none') $('modal').style.display = 'none'; });
let META = {};
fetch('assets/cards_meta.json').then(r => r.json()).then(m => META = m).catch(() => {});
/* ミッションの適性データ（開幕演出 opening.js と同じ /assets/missions.json を使う） */
let MISSIONS = {};
const BAND = { OPT: ['光学', '#5b9bd5'], SAR: ['SAR', '#e0685f'],
               TIR: ['熱赤外', '#e8964a'], HYP: ['ハイパー', '#9b7fd4'] };
fetch('assets/missions.json').then(r => r.json())
  .then(m => { MISSIONS = m; if (S) render(S); }).catch(() => {});
function openModal(kind, slug) {
  $('modalframe').src = `cards/${kind}/${slug}.html`;
  const m = META[slug];
  if (m && m.lore) {
    $('minfo').style.display = 'block';
    $('minfo').innerHTML = `<h3>${m.name}</h3>` +
      (m.spec ? `<div class="spec">${m.spec}</div>` : '') +
      `<div class="lore">${m.lore}</div>` +
      (m.credit ? `<div class="credit">画像: ${m.credit}</div>` : '');
  } else { $('minfo').style.display = 'none'; }
  if ($('modal').style.display !== 'flex' && isMobileLayout()) {
    try { history.pushState({sdgModal: 1}, ''); } catch (_) {}   // 端末の「戻る」で閉じられる
  }
  $('modal').style.display = 'flex';
  $('modal').scrollTop = 0; const mw = $('modal').querySelector('.mwrap'); if (mw) mw.scrollTop = 0;
  sdgHook('onCardClick', kind, slug, m);
}

function togglePick(b) {
  const i = Number(b.dataset.hand);
  if (picked.has(i)) { picked.delete(i); b.classList.remove('pick'); }
  else if (picked.size < 3) { picked.add(i); b.classList.add('pick'); }
}

function setBusy(on) {

async function post(path, body) {

let cineSkipped = false;

async function playAndRender(r) {
  const evs = r.events || [];
  const launch = evs.find(e => e.kind === 'launch');
  // 打上演出は launch_fx.js が祝福パートを足した版を持つ。フック経由で呼び、
  // モジュール未読込みのときだけ素のシネマにフォールバックする。
  if (launch && launch.dice) {
    const sc = window.SDG.scene && window.SDG.scene.launch;
    await (sc ? sc.play(launch) : launchCine(launch));
  }
  render(r);
  for (const ev of evs) {
    if (ev.kind === 'declare') { ghostFly($('hand'), $('field'), '🔧'); flash($('field')); }
    if (ev.kind === 'load')    { flash($('field')); floatChip('🔗搭載', '#8fb4ff', $('field')); }
    if (ev.kind === 'evolve')  { flash($('field')); floatChip('⬆️進化！', '#c9a4ff', $('field')); }
    if (ev.kind === 'fund' && ev.dice) await fundDiceFx(ev.dice, ev.money);
    if (ev.kind === 'answer' || ((ev.kind === 'launch' || ev.kind === 'answer') && ev.score > 0)) {
      if (ev.score > 0) scoreFx(ev.score);
    }
    if (ev.draw > 0) drawFx(ev.draw);
    if (ev.money) moneyFx(ev.money);
    if (ev.reveal) { flash($('board')); floatChip('🌏 新しい課題！', '#f2c14e', $('board')); }
    // CPUの手番は cpu_digest.js がダイジェスト画面で見せる（トーストは役割が重複するため削除）
    await sleep(120);
  }
}

/* ==== 場のミッション（横長の絵札パネル） ====
   券面(816x1110)の縮小ではなく、Web向けの横長タイルで絵札を大きく見せる。
   絵札は cards/mission_art/ の静的ファイル。拡張子違い→無しの順にフォールバックする。 */
function missionTile(m) {
  const info = MISSIONS[m.slug] || {};
  const apt = info.apt || {};
  const best = Object.entries(apt).sort((a, b) => b[1] - a[1])[0];
  const el = document.createElement('div');
  el.className = 'mtile';
  el.style.setProperty('--c', best && best[1] > 0 ? BAND[best[0]][1] : '#5b9bd5');
  if (info.crit_note) el.title = '⭐ ' + info.crit_note;
  const bands = Object.entries(apt).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])
    .map(([b, v]) => `<span class="bd" style="--b:${BAND[b][1]}">` +
        `<i>${v >= 3 ? '◎' : v >= 2 ? '○' : '△'}</i>${BAND[b][0]}<b>${v}</b></span>`).join('');
  el.innerHTML =
    `<div class="art"><span class="ph">🌏</span><img alt=""></div>` +
    `<div class="mbody">` +
      `<div class="mk">MISSION<s>T${m.since}年に登場</s></div>` +
      `<div class="mnm">${info.name || m.name}</div>` +
      `<div class="mbands">${bands || '<span class="bd none">適性データなし</span>'}</div>` +
      (info.flavor ? `<div class="mfl">${info.flavor}</div>` : '') +
    `</div><span class="mzoom">券面を見る ⤢</span>`;
  const img = el.querySelector('img');
  // 絵札は実写8枚が .jpg、自作イラスト3枚が .svg。jpg が無ければ svg を試す。
  img.onerror = () => {
    if (!img.dataset.retried) {
      img.dataset.retried = '1';
      img.src = `cards/mission_art/${m.slug}.svg`;
      return;
    }
    el.classList.add('noart'); img.remove();
  };
  img.src = `cards/mission_art/${m.slug}.jpg`;
  el.onclick = () => openModal('mission', m.slug);
  return el;
}

/* ==== 貢献度ランキング（あなた＋CPU3体） ==== */
function renderStandings(s) {
  const rows = [{
    nm: 'あなた', tag: 'YOU', me: true, score: s.you.score, money: s.you.money,
    hand: s.you.hand.length, dev: s.you.table.length + s.you.sats.length, orbit: s.you.orbit.length,
  }].concat(s.others.map(o => ({
    nm: o.name.replace(/[（(].*$/, ''), tag: o.policy || '', me: false,
    score: o.score, money: o.money, hand: o.hand,
    dev: o.table.length + o.sats.length, orbit: o.orbit.length,
  })));
  const order = rows.slice().sort((a, b) => b.score - a.score || b.money - a.money);
  order.forEach((r, i) => { r.rank = (i > 0 && order[i-1].score === r.score) ? order[i-1].rank : i + 1; });
  const top = Math.max(1, ...rows.map(r => r.score));
  const op = $('opp'); op.innerHTML = '';
  for (const r of order) {
    const d = document.createElement('div');
    d.className = 'rv' + (r.me ? ' me' : '') + (r.rank === 1 && r.score > 0 ? ' p1' : '');
    d.innerHTML =
      `<div class="rk">${r.rank}</div><div class="rvb">` +
      `<div class="r1"><span class="nm">${r.nm}</span><span class="tag">${r.tag}</span>` +
      `<span class="sc">${r.score}<i>点</i></span></div>` +
      `<div class="bar"><span style="width:${Math.round(r.score / top * 100)}%"></span></div>` +
      `<div class="r2"><span>💰<b>${r.money}</b>億</span><span>🃏<b>${r.hand}</b></span>` +
      `<span>🛠<b>${r.dev}</b></span><span>🛰<b>${r.orbit}</b></span></div></div>`;
    op.appendChild(d);
  }
}

/* 選べない理由（破線タイルに表示する）。合法手が無いときだけ呼ばれる。 */
function whyNot(key, s) {
  const used = new Set(s.used || []);
  const noAct = s.actions_left <= 0;
  switch (key) {
    case 'develop':
      if (used.has('declare')) return 'この年は開発宣言済みです';
      if (noAct) return '残りアクションがありません';
      if (!s.you.hand.length) return '手札がありません';
      return '資金が足りません';
    case 'launch':
      if (used.has('launch')) return 'この年はすでに打ち上げ済みです';
      if (noAct) return '残りアクションがありません';
      if (!s.you.sats.length) return '搭載済みの機体がない';
      if (s.you.money < 100) return '資金が足りません（打上に100億）';
      return '打ち上げられる機体がない';
    case 'answer':
      if (!s.you.orbit.length) return '軌道上に衛星がいない';
      return '軌道上の衛星で解ける課題がありません';
    case 'exchange':
      if (used.has('exchange')) return 'この年はすでに交換済みです';
      if (noAct) return '残りアクションがありません';
      return '手札がありません';
    case 'fund':
      if (used.has('fund')) return 'この年はすでに調達済みです';
      if (noAct) return '残りアクションがありません';
      return 'いまは選べません';
  }
  return 'いまは選べません';
}
/* サーバの options には payload が載らないため、label の先頭のカード名で
   手札のカード（kind='rocket' / 'sensor'）と突き合わせる。
   declare の id は「払える手札だけ」の連番なので手札indexとは一致しない。
   同名カードは払える順に対応させれば実害がない（同名＝同一カード）。 */
function annotateOptions(s) {
  const taken = new Set();
  for (const o of s.options) {
    o.card = null; o.hi = -1;
    let nm = null;
    if (o.kind === 'declare') nm = o.label.replace(/ を開発宣言.*$/, '');
    if (!nm) continue;
    const i = s.you.hand.findIndex((c, j) => c.name === nm && !taken.has(j));
    if (i < 0) continue;
    taken.add(i);
    o.card = s.you.hand[i]; o.hi = i;
  }
}
const KIND_JP = {rocket: 'ロケット', sensor: '衛星'};
const KIND_ICO = {rocket: '🚀', sensor: '🛰'};

function renderActionTiles(s, ac) {
  ac.className = 'btncol tiles';
  const byKind = {};
  for (const o of s.options) (byKind[o.kind] = byKind[o.kind] || []).push(o);
  /* ACT_CATS が知らない kind（将来のルール変更など）は「その他」に集約する。
     どの合法手にも到達できなくなることが無いようにするための保険。 */
  const known = new Set(ACT_CATS.reduce((a, c) => a.concat(c.kinds), []));
  const restKinds = [...new Set(s.options.map(o => o.kind).filter(k => !known.has(k)))];
  const cats = restKinds.length
    ? ACT_CATS.concat([{key:'other', ico:'✳️', jp:'その他の行動', en:'OTHER', wide:true,
                        kinds:restKinds, desc:'このルールで追加された行動です。'}])
    : ACT_CATS;
  for (const cat of cats) {
    const opts = cat.kinds.reduce((a, k) => a.concat(byKind[k] || []), []);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'atile' + (cat.wide ? ' wide' : '') + (cat.free ? ' free' : '') + (opts.length ? '' : ' off');
    b.innerHTML =
      `<span class="r1"><i class="ic">${cat.ico}</i><span class="nm">${cat.jp}</span>` +
      (opts.length ? `<span class="ct">${opts.length}</span>` : '') + `</span>` +
      `<span class="r2">${opts.length ? cat.en : whyNot(cat.key, s)}</span>`;
    /* 選べない大項目は onclick を付けない（disabled は使わない。
       setBusy(false) が #actions の button を一律で有効化してしまうため） */
    if (opts.length) b.onclick = () => openActs(cat, opts);
    ac.appendChild(b);
  }
}
function openActs(cat, opts) {
  const m = $('actmodal');
  const byKind = {};
  for (const o of opts) (byKind[o.kind] = byKind[o.kind] || []).push(o);
  let html = `<div class="amw"><div class="amh"><i class="ic">${cat.ico}</i><div>` +
    `<div class="kick">${cat.en}</div><h3>${cat.jp}</h3></div>` +
    `<button type="button" class="amx" title="閉じる">✕</button></div>` +
    `<div class="amd">${cat.desc}</div>`;
  for (const k of cat.kinds) {
    const list = byKind[k];
    if (!list || !list.length) continue;
    const sec = ACT_SECS[k] || [String(k).toUpperCase(), ''];
    html += `<div class="sec"><div class="sech">${sec[0]}</div><div class="secd">${sec[1]}</div>`;
    /* ロケット / 衛星 でジャンル分け（券面と同じ 赤=ロケット・青=衛星 の配色） */
    const groups = list.some(o => o.card)
      ? [['rocket', list.filter(o => o.card && o.card.kind === 'rocket')],
         ['sensor', list.filter(o => o.card && o.card.kind === 'sensor')],
         ['',       list.filter(o => !o.card)]]
      : [['', list]];
    for (const [gk, gl] of groups) {
      if (!gl.length) continue;
      if (gk) html += `<div class="grp k-${gk}"><i>${KIND_ICO[gk]}</i>${KIND_JP[gk]}<b>${gl.length}</b></div>`;
      for (const o of gl) html += optionButton(o, k);
    }
    html += `</div>`;
  }
  html += `<div class="amhint">ESC ／ 画面外クリックで戻る</div></div>`;
  m.innerHTML = html;
  m.classList.add('on');
  m.onclick = ev => { if (ev.target === m) closeActs(); };
  m.querySelector('.amw').onclick = ev => ev.stopPropagation();
  m.querySelector('.amx').onclick = closeActs;
  m.querySelectorAll('.op').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id, kind = b.dataset.kind;
      closeActs();
      if (kind === 'exchange') startExchange();
      else post('/act', {id});
    };
  });
}
function optionButton(o, k) {
  const kd = o.card ? o.card.kind : '';
  const meta = o.card ? (KIND_JP[kd] || '') + (o.card.life ? `・寿命${o.card.life}年` : '') : '';
  return `<button type="button" class="op${(k === 'answer' || k === 'load') ? ' freeop' : ''}` +
    `${kd ? ' k-' + kd : ''}" data-id="${o.id}" data-kind="${o.kind}">` +
    (kd ? `<i class="oic">${KIND_ICO[kd]}</i>` : '') +
    `<span class="olb">${o.label}</span>` + (meta ? `<s class="omt">${meta}</s>` : '') + `</button>`;
}
function closeActs() {
  const m = $('actmodal');
  if (!m) return;
  m.classList.remove('on'); m.onclick = null; m.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('actmodal').classList.contains('on')) closeActs();
  else if ($('modal').style.display === 'flex') $('modal').style.display = 'none';
});

/* ==== 手札カードのメニュー（開発する／券面を拡大） ==== */
function closeCardMenu() {
  const m = document.getElementById('cardmenu');
  if (m) m.remove();
  document.removeEventListener('click', closeCardMenu, true);
}
function openCardMenu(box, hi, kind, slug) {
  closeCardMenu();
  const c = S && S.you.hand[hi];
  if (!c) { openModal(kind, slug); return; }
  const dec = S.options.find(o => o.kind === 'declare' && o.hi === hi);
  const used = new Set(S.used || []);
  const lack = c.cost - S.you.money;
  const why = used.has('declare') ? '今年はもう開発済みです'
            : S.actions_left <= 0 ? '残りアクションがありません'
            : lack > 0            ? `資金があと ${lack}億 足りません`
            : '今は開発できません';
  const m = document.createElement('div');
  m.id = 'cardmenu';
  m.innerHTML =
    `<div class="cmh k-${c.kind}"><i class="cmi">${KIND_ICO[c.kind] || '🃏'}</i><div>` +
      `<div class="cmn">${c.name}</div>` +
      `<div class="cmd">${KIND_JP[c.kind] || ''}・${c.cost}億${c.life ? `・設計寿命${c.life}年` : ''}</div>` +
    `</div></div>` +
    `<button type="button" class="cmb dev${dec ? '' : ' off'}">` +
      `<b>🔧 開発する${dec ? `（-${c.cost}億）` : ''}</b>${dec ? '' : `<s>${why}</s>`}</button>` +
    `<button type="button" class="cmb zoom"><b>🔍 券面を拡大して見る</b></button>`;
  document.body.appendChild(m);
  const r = box.getBoundingClientRect(), mr = m.getBoundingClientRect();
  /* スマホ縦持ちでは手番パネル（#overlay）が画面下に固定されたボトムシートになる（mobile.css）。
     その高さぶんを「使える下端」から差し引き、メニューがシートの下に潜らないようにする。 */
  const ov = $('overlay');
  const sheetH = (ov && getComputedStyle(ov).position === 'fixed') ? ov.getBoundingClientRect().height : 0;
  const vw = window.innerWidth, vh = window.innerHeight - sheetH;
  let left = r.left + r.width / 2 - mr.width / 2;
  left = Math.max(8, Math.min(left, vw - mr.width - 8));
  let top = r.top - mr.height - 8;                                  // まずカードの上
  if (top < 8) top = r.bottom + 8;                                  // 入らなければ下
  if (top + mr.height > vh - 8) top = vh - mr.height - 8;           // それでも溢れるなら下端に寄せる
  top = Math.max(8, top);                                           // 上端は必ず画面内
  m.style.left = Math.round(left) + 'px';
  m.style.top = Math.round(top) + 'px';
  m.classList.add('on');
  m.onclick = e => e.stopPropagation();
  if (dec) m.querySelector('.dev').onclick = () => { closeCardMenu(); post('/act', {id: dec.id}); };
  m.querySelector('.zoom').onclick = () => { closeCardMenu(); openModal(kind, slug); };
  setTimeout(() => document.addEventListener('click', closeCardMenu, true), 0);
}

function startExchange() {
  exchangeMode = true; picked = new Set();
  $('exchangeUI').style.display = 'block';
  document.body.classList.add('exchanging');
  $('err').textContent = '';
}
$('doExchange').onclick = () => {
  const ex = S.options.find(o => o.kind === 'exchange');
  if (!ex || !picked.size) { $('err').textContent = '交換するカードを1〜3枚選んでください'; return; }
  const ids = [...picked]; exchangeMode = false; picked = new Set();
  post('/act', {id: ex.id, extra: ids});
};
$('cancelExchange').onclick = () => { exchangeMode = false; picked = new Set(); render(S); };
$('endturn').onclick = () => { exchangeMode = false; picked = new Set(); post('/end_turn'); };
/* 新規ゲーム: ヘッダの🆕 → 確認ポップアップ → 実行 */
function resetNewGameConfirm() { $('ngpop').hidden = true; }
/* ヘッダの「ルール説明」タブ。ゲーム中いつでも開ける。閉じるとそのまま盤面に戻る
   （引数なしで呼ぶと rules.js の onDone が null になり、ゲームは開始されない）。 */
$('rulesTab').onclick = () => { if (window.SDG.showRules) window.SDG.showRules(); };

$('newgame').onclick = e => { e.stopPropagation(); $('ngpop').hidden = !$('ngpop').hidden; };
$('ngNo').onclick = resetNewGameConfirm;
$('ngYes').onclick = () => {
  resetNewGameConfirm();
  exchangeMode = false; picked = new Set();
  post('/new_game');
};
addEventListener('click', e => { if (!$('ngpop').hidden && !e.target.closest('#ngpop,#newgame')) resetNewGameConfirm(); });
addEventListener('keydown', e => { if (e.key === 'Escape') resetNewGameConfirm(); });

/* ---- スマホ縦持ち: 手番パネル（ボトムシート）の折りたたみ ----
   既定は畳んだ状態（見出し＋残りアクションだけ）で盤面を広く見せる。
   自分の手番が来たとき（YEAR が進んだとき）とエラー表示時は自動で開く。 */
function isMobileLayout() {
  return !document.documentElement.hasAttribute('data-desktop') && matchMedia('(max-width: 700px)').matches;
}
let sheetOpen = true, sheetTurnKey = null;
function setSheet(open) {
  sheetOpen = !!open;
  $('overlay').classList.toggle('collapsed', !sheetOpen);
  document.body.classList.toggle('sheet-collapsed', !sheetOpen);
  $('sheetToggle').setAttribute('aria-expanded', String(sheetOpen));
  $('sheetToggle').querySelector('i').textContent = sheetOpen ? '▾' : '▴';
}
$('sheetToggle').onclick = e => { e.stopPropagation(); setSheet(!sheetOpen); };
$('overlay').querySelector('h2').onclick = () => { if (isMobileLayout()) setSheet(!sheetOpen); };
function syncSheet(s) {
  if (!isMobileLayout()) { if (!sheetOpen) setSheet(true); return; }
  const key = `${s.turn}:${s.phase}`;
  if (sheetTurnKey === null) { sheetTurnKey = key; setSheet(s.phase === 'over'); return; }   // 初回は畳む
  if (key !== sheetTurnKey) { sheetTurnKey = key; setSheet(true); return; }                 // 手番が来た／終局
  if (s.error) setSheet(true);                                                              // 理由を見せる
}
$('endturn').addEventListener('click', () => { if (isMobileLayout()) setSheet(false); });

/* ---- スマホ縦持ち: タブ切替（盤面 / 手札・艦隊 / 順位・ログ）----
   body[data-mtab] を CSS が見て6パネルを出し分ける。PC では data-mtab が付かず全パネル表示。 */
let mtab = 'board', mtabBefore = null;
function setTab(t, remember) {
  if (remember) mtabBefore = mtab;
  mtab = t;
  document.body.dataset.mtab = t;
  $('mtabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  window.scrollTo({top: 0});
}
$('mtabs').querySelectorAll('button').forEach(b => b.onclick = () => { mtabBefore = null; setTab(b.dataset.tab); });
let mtabPhase = null;
function syncTabs(s) {
  if (!isMobileLayout()) { delete document.body.dataset.mtab; return; }
  if (!document.body.dataset.mtab) setTab(mtab);
  $('mtabHand').textContent = s.you.hand.length || '';
  const hn = s.you.hand.length;
  $('handhint').textContent = hn > 3 ? `◀ 横にスワイプ ── 手札は全 ${hn} 枚 ▶` : '';
  if (exchangeMode && mtab !== 'hand') setTab('hand', true);                 // 交換する手札を選ばせる
  if (!exchangeMode && mtabBefore) { const b = mtabBefore; mtabBefore = null; setTab(b); }
  if (s.phase === 'over' && mtabPhase !== 'over') setTab('info');           // 終局 → 順位
  mtabPhase = s.phase;
}
addEventListener('resize', () => { if (S) syncTabs(S); });
$('hand').addEventListener('scroll', () => { $('handhint').classList.add('seen'); }, {passive: true});
