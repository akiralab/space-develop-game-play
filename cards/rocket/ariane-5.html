<!doctype html><meta charset='utf-8'>
<style>
@font-face { font-family: sys; src: local("Hiragino Sans"), local("Noto Sans JP"); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:816px; height:1110px; overflow:hidden;
  font-family: sys, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing:antialiased; }
.card { position:relative; width:816px; height:1110px; overflow:hidden; color:#10151f; }
.art { position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.art-svg { width:74%; height:74%; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
.stars { position:absolute; inset:0; background-repeat:no-repeat; }
.tag { display:inline-flex; align-items:center; gap:8px; font-weight:800; }
.mono { font-variant-numeric: tabular-nums; }
.klass-box { display:inline-block; height:20px; border-radius:3px; background:currentColor; }
.art-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.art-fill { position:absolute; inset:0; width:100%; height:100%; display:block; }
.art-credit { position:absolute; right:12px; bottom:8px; font-size:16px; z-index:2;
              color:rgba(255,255,255,.78); text-shadow:0 1px 4px rgba(0,0,0,.9); }

.card { background:#eef0f6; }
.frame { position:absolute; inset:26px; border:6px solid #93264C; border-radius:16px; background:#fffdf9;
         box-shadow: inset 0 0 0 3px rgba(0,0,0,.06); display:flex; flex-direction:column; overflow:hidden; }
.head { background:linear-gradient(100deg,#93264C,#93264Ccc); color:#fff; padding:16px 20px 14px;
        display:flex; align-items:center; gap:14px; }
.head .mk { font-size:32px; }
.head .emblem { width:58px; height:58px; flex:0 0 auto; filter: drop-shadow(0 2px 5px rgba(0,0,0,.3)); }
.head .nm { font-size:44px; font-weight:800; flex:1; letter-spacing:.01em; }
.head .cost { background:#fff; color:#93264C; font-size:34px; font-weight:800;
              padding:4px 16px; border-radius:26px; line-height:1.25; }
.head .cost small { font-size:20px; }
.type { display:flex; justify-content:space-between; align-items:center; padding:9px 22px;
        background:#f1eee6; font-size:23px; font-weight:700; color:#3b3527; }
.art { height:521px; background:linear-gradient(160deg,#0a1330,#1b2b5e 55%,#93264C); }
.chips { display:flex; gap:12px; padding:16px 18px 4px; }
.chip { flex:1; background:#f4f1e7; border:2px solid #e7e1d2; border-radius:16px;
        padding:9px 4px 10px; text-align:center; }
.chip .ic { font-size:27px; line-height:1.1; }
.chip .vl { font-size:44px; font-weight:800; color:#93264C; line-height:1.15; }
.chip .vl.pw { font-size:30px; letter-spacing:-.02em; }
.chip .lb { font-size:18px; color:#6a6252; font-weight:700; }
.flavor { margin:12px 20px 0; padding:12px 15px; background:#f6f2e6; border-left:8px solid #93264C;
          font-size:23px; line-height:1.45; color:#3b3527; }
.sp { flex:1; }
.foot { display:flex; justify-content:space-between; padding:8px 22px 14px;
        font-size:19px; color:#7a7364; }
</style>
