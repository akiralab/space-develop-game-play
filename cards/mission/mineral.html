<!doctype html><meta charset='utf-8'>
<style>
@font-face { font-family: sys; src: local("Hiragino Sans"), local("Noto Sans JP"); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:816px; height:1110px; overflow:hidden;
  font-family: sys, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing:antialiased; }
.card { position:relative; width:816px; height:1110px; overflow:hidden; color:#10151f; }
.art { position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.art-svg { width:74%; height:74%; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
.stars { position:absolute; inset:0; background-repeat:no-repeat; }
.tag { display:inline-flex; align-items:center; gap:8px; font-weight:800; }
.mono { font-variant-numeric: tabular-nums; }
.klass-box { display:inline-block; height:20px; border-radius:3px; background:currentColor; }
.art-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.art-fill { position:absolute; inset:0; width:100%; height:100%; display:block; }
.art-credit { position:absolute; right:12px; bottom:8px; font-size:16px; z-index:2;
              max-width:calc(100% - 24px); text-align:right; line-height:1.25;
              color:rgba(255,255,255,.78); text-shadow:0 1px 4px rgba(0,0,0,.9); }

.card { background:#f3efe2; }
.frame { position:absolute; inset:26px; border:6px solid #B8860B; border-radius:16px; background:#fffdf6;
         display:flex; flex-direction:column; overflow:hidden;
         box-shadow: inset 0 0 0 3px rgba(0,0,0,.06); }
.head { background:linear-gradient(100deg,#B8860B,#8a6508); color:#fff; padding:16px 20px 13px;
        display:flex; align-items:center; gap:12px; }
.head .mk { font-size:30px; }
.head .nm { font-size:41px; font-weight:800; flex:1; letter-spacing:.01em; }
.type { padding:9px 22px; background:#f0e9d2; font-size:23px; font-weight:700; color:#5a4a1e; }
.art { height:366px; background:radial-gradient(ellipse at 50% 120%, #24457e, #0a1128 78%); }
.grid { display:flex; gap:10px; padding:16px 18px 4px; }
.mc { flex:1; background:#f6f1df; border:2px solid #e8e0c6; border-radius:14px;
      padding:10px 4px 9px; text-align:center; }
.mi { font-size:26px; line-height:1.1; }
.mv { font-size:42px; font-weight:800; line-height:1.15; }
.ml { font-size:17px; color:#6a6252; font-weight:700; }
.crit { margin:13px 20px 0; padding:11px 15px; background:#fdf3d7; border-left:8px solid #B8860B;
        font-size:22px; line-height:1.4; color:#5a4a1e; }
.crit b { color:#8a6508; }
.flavor { margin:10px 20px 0; font-size:22px; line-height:1.45; color:#4a4436; }
.sp { flex:1; }
.foot { display:flex; justify-content:space-between; padding:8px 22px 14px;
        font-size:19px; color:#7a7364; }
</style>
